[package]
name = "monitor-agent-remote"
version = "0.2.4"
edition = "2024"
description = "Receptor remoto de avisos de monitor-agent con panel web y almacenamiento SQLite"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
